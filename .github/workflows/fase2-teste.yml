name: Fase 2 - teste de fundamentos (CVM)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnóstico da estrutura dos arquivos da CVM
        continue-on-error: true
        run: python3 scripts/fase2/diagnostico_cvm.py 2>&1 | tee dados/besst/fase2_teste/log_diagnostico.txt
      - name: Rodar o esboço de fundamentos
        continue-on-error: true
        run: |
          python3 scripts/fase2/fundamentos_cvm.py --painel dados/besst/painel.json \
            --saida dados/besst/fase2_teste/fundamentos.json 2>&1 | tee dados/besst/fase2_teste/log_fundamentos.txt
      - name: Guardar resultados do teste
        run: |
          git config user.name "market-lab bot"
          git config user.email "actions@users.noreply.github.com"
          git add dados/besst/fase2_teste
          git diff --cached --quiet && exit 0
          git commit -m "Fase 2: resultado do teste de fundamentos (CVM)"
          git pull --rebase
          git push
