name: Portugal - dividendos nos relatórios ESEF (diagnóstico, não publica)

# Execução manual. Lê os relatórios anuais ESEF e imprime as rubricas de dividendos no log. Não faz commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dividendos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dividendos
        run: python3 scripts/portugal/dividendos_esef.py
