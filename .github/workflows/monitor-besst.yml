name: Atualizar Monitor BESST

on:
  schedule:
    # Uma atualização por dia, depois do fechamento (pregão B3: 10h-17h55, call até 18h). O GitHub pode atrasar
    # ou descartar execuções agendadas, por isso há várias tentativas; só a primeira que mudar algo publica.
    # Horários em UTC (Brasília = UTC-3): 18h22, 18h47, 19h23, 20h23 e 22h09.
    - cron: "22,47 21 * * 1-5"
    - cron: "23 22,23 * * 1-5"
    - cron: "9 1 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-besst-precos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar preços e proventos e recalcular
        run: python3 scripts/besst_painel.py --coletar
      - name: Publicar se houve mudança
        run: |
          git config user.name "market-lab bot"
          git config user.email "actions@users.noreply.github.com"
          git add dados/besst/painel.json dados/besst/brutos/ultimo.json
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "Monitor BESST: atualização automática $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
