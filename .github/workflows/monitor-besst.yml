name: Atualizar Monitor BESST

on:
  schedule:
    # O GitHub atrasa e descarta execuções agendadas em horário de pico; por isso há horários redundantes
    # (todos em UTC; Brasília = UTC-3). Pregão B3 desde 03/11/2026: 10h-17h55, call de fechamento até 18h.
    - cron: "7,37 13-20 * * 1-5"   # durante o pregão, a cada ~30 min
    - cron: "22,47 21 * * 1-5"     # logo após o fechamento (18h22 e 18h47)
    - cron: "23 22,23 * * 1-5"     # reforço pós-fechamento (19h23 e 20h23)
    - cron: "9 1 * * 2-6"          # madrugada seguinte (22h09), garante o fechamento do dia
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-besst-precos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar preços e proventos e recalcular
        run: python3 scripts/besst_painel.py --coletar
      - name: Publicar se houve mudança
        run: |
          git config user.name "market-lab bot"
          git config user.email "actions@users.noreply.github.com"
          git add dados/besst/painel.json dados/besst/brutos/ultimo.json
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "Monitor BESST: atualização automática $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
