name: Atualizar Monitor BESST

on:
  schedule:
    # De hora em hora durante o pregão da B3 (13h–21h UTC = 10h–18h em Brasília), dias úteis
    - cron: "17 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-besst-precos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar preços e proventos e recalcular
        run: python3 scripts/besst_painel.py --coletar
      - name: Publicar se houve mudança
        run: |
          git config user.name "market-lab bot"
          git config user.email "actions@users.noreply.github.com"
          git add dados/besst/painel.json dados/besst/brutos/ultimo.json
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "Monitor BESST: atualização automática $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
